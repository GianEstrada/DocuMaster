<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocuMaster - Historial</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fa; color: #3e4b5b; }
    header { background: #183b63; padding: 12px 16px; display: flex; gap: 10px; }
    header a { color: #fff; text-decoration: none; background: #2e6da4; padding: 12px 18px; border-radius: 6px; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #dde3ea; }
    th { background: #eaf0f5; }
    td a { color: #2e6da4; font-weight: bold; }
  </style>
</head>
<body>
  <header><a href="/">Nuevo contrato</a></header>
  <main>
    <h1>Historial de contratos</h1>
    <table>
      <thead><tr><th>Folio</th><th>Cliente</th><th>Total</th><th>Fecha</th></tr></thead>
      <tbody>
      {% for c in contratos %}
        <tr>
          <td><a href="/contratos/{{ c.id }}">{{ c.folio }}</a></td>
          <td>{{ c.cliente }}</td>
          <td>${{ "{:,.2f}".format(c.total|float) }}</td>
          <td>{{ c.created_at[:10] }}</td>
        </tr>
      {% else %}
        <tr><td colspan="4">Aún no hay contratos.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </main>
</body>
</html>
