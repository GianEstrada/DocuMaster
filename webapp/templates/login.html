<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocuMaster - Acceso</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eaf0f5; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    form { background: #fff; padding: 28px; border-radius: 10px; width: min(360px, 90vw); box-shadow: 0 2px 12px rgba(0,0,0,.12); }
    h1 { color: #183b63; font-size: 22px; margin-top: 0; }
    input, button { width: 100%; box-sizing: border-box; font-size: 18px; padding: 14px; margin-top: 12px; border-radius: 6px; }
    input { border: 1px solid #c8d1da; }
    button { background: #2e6da4; color: #fff; border: 0; cursor: pointer; }
    .error { color: #b00020; margin: 10px 0 0; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>DocuMaster</h1>
    <input type="password" name="password" placeholder="Contraseña" autocomplete="current-password" required autofocus>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
